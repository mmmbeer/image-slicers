<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Imaginarium</title>
  <link rel="icon" type="image/png" href="./src/assets/logo-icon.png" />
  <link rel="stylesheet" href="./src/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/konva@9.3.1/konva.min.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <img src="./src/assets/logo.png" alt="Imaginarium" />
      </div>
      <nav id="toolNav" class="tool-nav" aria-label="Image tools"></nav>
      <div class="toolbar" aria-label="Workspace actions">
        <label class="icon-button import-button" title="Import image" aria-label="Import image">
          <img src="./src/assets/import.png" alt="" aria-hidden="true" />
          <input id="fileInput" type="file" accept="image/*" />
        </label>
        <button id="resetButton" class="icon-button" type="button" title="Reset tool" aria-label="Reset tool">
          <img src="./src/assets/reset.png" alt="" aria-hidden="true" />
        </button>
        <button id="exportButton" class="primary-button" type="button" title="Export files" disabled>
          <img src="./src/assets/export.png" alt="" aria-hidden="true" />
          <span>Export</span>
        </button>
        <button id="zipButton" class="primary-button" type="button" title="Export ZIP" disabled>
          <img src="./src/assets/zip.png" alt="" aria-hidden="true" />
          <span>ZIP</span>
        </button>
      </div>
    </header>

    <main class="workspace">
      <section id="dropZone" class="tool-host" aria-label="Image workspace">
        <div id="toolRoot" class="tool-root"></div>
        <div id="emptyState" class="empty-state">
          <div class="empty-state-icon">+</div>
          <h2>Drop an image here</h2>
          <p>PNG, JPG, and transparent images stay in your browser. Use the toolbar to export local files.</p>
        </div>
      </section>
    </main>

    <footer class="statusbar" aria-label="Workspace status">
      <span id="statusTool">Tool: -</span>
      <span id="statusFile">File: none</span>
      <span id="statusDimensions">Image: -</span>
      <span id="statusExports">Exports: 0</span>
      <span id="statusMode">Ready</span>
    </footer>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
