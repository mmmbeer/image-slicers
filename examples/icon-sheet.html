
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Import Icon</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/css/import.css" />
  <script src="https://cdn.jsdelivr.net/npm/konva@9.3.1/konva.min.js"></script>
</head>
<body>
  <div class="import-container">
    <h1>Upload 3x3 Icon Sheet</h1>
	<form id="icon-form" action="/import/save" method="POST" enctype="multipart/form-data">

      <div class="form-group">
        <label for="upload">Upload Icon Sheet</label>
        <input type="file" id="upload" name="sheet" accept="image/*" required />
      </div>
	  
	  <div class="form-group">
		  <label for="style-select">Style</label>
		  <select id="style-select" name="style" required>
			
			  <option value="fantasy">Fantasy</option>
			
			  <option value="modern">Modern</option>
			
			  <option value="scifi">Scifi</option>
			
			  <option value="token">Token</option>
			
		  </select>
		</div>

      <div class="form-group">
        <label for="icon-name">Icon Name</label>
        <input type="text" id="icon-name" name="name" placeholder="Enter icon name" required />
      </div>

	  <div class="form-group">
		  <label for="tag-input">Tags</label>
		  <input type="text" id="tag-input" placeholder="Type to add tag..." autocomplete="off" />
		  <div id="tag-suggestions" class="suggestions"></div>
		  <div id="selected-tags" class="tag-badges"></div>
		</div>
<div class="canvas-and-controls">

  <div class="scale-controls">
<label>
  Scale: <input type="range" id="scale-slider" min="4" step="4" value="0">
</label>
</div>

  <div id="canvas-container" style="width: 256px; height: 256px; border: 2px solid #f0d090;"></div>

  <div class="image-controls">
  <button type="button" id="flip-x">Flip X</button>
  <button type="button" id="flip-y">Flip Y</button>
  <button type="button" id="rotate-90">Rotate 90°</button>
  <button type="button" id="center-image">Center</button>
  <button type="button" id="reset-image">Reset</button>

  <label>Brightness: <input type="range" id="brightness" min="-1" max="1" step="0.1" value="0"></label>
  <label>Contrast: <input type="range" id="contrast" min="-100" max="100" step="10" value="0"></label>
  <label>Saturation: <input type="range" id="saturation" min="-1" max="1" step="0.1" value="0"></label>
  <label>Hue: <input type="range" id="hue" min="0" max="360" step="15" value="0"></label>
  <label>Blur: <input type="range" id="blur" min="0" max="10" step="1" value="0"></label>
  <label>Pixelate: <input type="range" id="pixel" min="1" max="20" step="1" value="1"></label>
</div>
</div>


<input type="hidden" name="cropX" id="cropX" />
<input type="hidden" name="cropY" id="cropY" />
	  <input type="hidden" name="tags" id="tag-hidden" />

      <button type="submit" class="save-button">Save Icon</button>
    </form>
  </div>
